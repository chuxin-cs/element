<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审核表格系统</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    
    body {
      background-color: #f5f7fa;
      padding: 20px;
      color: #333;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .table-container {
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
      overflow: hidden;
      margin-bottom: 20px;
    }
    
    .table-header {
      display: flex;
      background: #f5f7fa;
      border-bottom: 1px solid #ebeef5;
      font-weight: bold;
      position: relative;
    }
    
    .table-row {
      display: flex;
      border-bottom: 1px solid #ebeef5;
      position: relative;
      transition: height 0.1s;
    }
    
    .table-cell {
      padding: 12px 16px;
      position: relative;
      overflow: hidden;
      height: 100%;
      display: flex;
      align-items: center;
    }
    
    /* 列宽调整手柄 */
    .resize-handle {
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      height: 100%;
      background: transparent;
      cursor: col-resize;
      z-index: 10;
    }
    
    .resize-handle:hover {
      background: #409eff;
    }
    
    .resize-handle.active {
      background: #409eff;
      width: 3px;
    }
    
    /* 行高调整手柄 - 整行底部 */
    .row-resize-handle {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 5px;
      background: transparent;
      cursor: row-resize;
      z-index: 5;
    }
    
    .row-resize-handle:hover {
      background: rgba(64, 158, 255, 0.3);
    }
    
    .row-resize-handle.active {
      background: #409eff;
    }
    
    .response-content {
      position: relative;
      padding-bottom: 15px;
      align-items: flex-start;
    }
    
    .content-text {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      line-height: 1.5;
      color: #606266;
    }
    
    select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      color: #606266;
      outline: none;
      transition: border-color 0.2s;
    }
    
    select:focus {
      border-color: #409eff;
    }
    
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #fff;
      border-top: 1px solid #ebeef5;
    }
    
    .page-info {
      color: #606266;
      font-size: 14px;
    }
    
    .page-controls {
      display: flex;
      align-items: center;
    }
    
    .page-btn {
      padding: 8px 12px;
      margin: 0 5px;
      background: #f4f4f5;
      color: #606266;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .page-btn:hover:not(.disabled) {
      color: #409eff;
      border-color: #409eff;
    }
    
    .page-btn.disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    .page-size-select {
      width: auto;
      margin: 0 10px;
    }
    
    .return-btn {
      padding: 8px 16px;
      background: #409eff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .return-btn:hover {
      background: #66b1ff;
    }
    
    .hint-text {
      color: #f56c6c;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
    }
    
    .scroll-hint {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(245, 108, 108, 0.8);
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 20;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
    
    /* 正在调整时的样式 */
    body.resizing {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h2>审核表格系统</h2>
      
      <div class="table-container">
        <!-- 表头 -->
        <div class="table-header">
          <div class="table-cell" :style="{ width: columns.testQuestion.width + 'px' }">测试题</div>
          <div class="table-cell" :style="{ width: columns.responseContent.width + 'px' }">响应内容</div>
          <div class="table-cell" :style="{ width: columns.machineReview.width + 'px' }">机审结果</div>
          <div class="table-cell" :style="{ width: columns.humanReview.width + 'px' }">人工审核结果</div>
          
          <!-- 列宽调整手柄 -->
          <div 
            class="resize-handle" 
            :class="{ active: resizing.column === 'testQuestion' }"
            @mousedown="startResize('testQuestion', $event)"
          ></div>
          <div 
            class="resize-handle" 
            :class="{ active: resizing.column === 'responseContent' }"
            @mousedown="startResize('responseContent', $event)"
          ></div>
          <div 
            class="resize-handle" 
            :class="{ active: resizing.column === 'machineReview' }"
            @mousedown="startResize('machineReview', $event)"
          ></div>
          <div 
            class="resize-handle" 
            :class="{ active: resizing.column === 'humanReview' }"
            @mousedown="startResize('humanReview', $event)"
          ></div>
        </div>
        
        <!-- 表格内容 -->
        <div 
          class="table-row" 
          v-for="(item, index) in paginatedData" 
          :key="index"
          :style="{ height: item.rowHeight + 'px' }"
        >
          <!-- 测试题 -->
          <div class="table-cell" :style="{ width: columns.testQuestion.width + 'px' }">
            {{ item.testQuestion }}
          </div>
          
          <!-- 响应内容 -->
          <div class="table-cell response-content" :style="{ width: columns.responseContent.width + 'px' }">
            <div class="content-text">
              {{ item.responseContent }}
            </div>
            <div class="scroll-hint" v-if="index === 0 && !isResizing">拖动行底部线条调整整行高度</div>
          </div>
          
          <!-- 机审结果 -->
          <div class="table-cell" :style="{ width: columns.machineReview.width + 'px' }">
            <select v-model="item.machineReview">
              <option value="安全">安全</option>
              <option value="不安全">不安全</option>
              <option value="拒答">拒答</option>
            </select>
          </div>
          
          <!-- 人工审核结果 -->
          <div class="table-cell" :style="{ width: columns.humanReview.width + 'px' }">
            <select v-model="item.humanReview">
              <option value="安全">安全</option>
              <option value="不安全">不安全</option>
              <option value="拒绝">拒绝</option>
              <option value="否决">否决</option>
            </select>
          </div>
          
          <!-- 行高调整手柄 - 整行底部 -->
          <div 
            class="row-resize-handle"
            :class="{ active: heightResizing.index === index }"
            @mousedown="startResizeHeight(index, $event)"
          ></div>
        </div>
        
        <!-- 分页控件 -->
        <div class="pagination">
          <div class="page-info">
            共{{ totalItems }}条
          </div>
          <div class="page-controls">
            <button 
              class="page-btn" 
              :class="{ disabled: currentPage === 1 }"
              @click="prevPage"
            >上一页</button>
            
            <select class="page-size-select" v-model="pageSize">
              <option value="10">10条/页</option>
              <option value="20">20条/页</option>
              <option value="50">50条/页</option>
            </select>
            
            <button 
              class="page-btn" 
              :class="{ disabled: currentPage >= totalPages }"
              @click="nextPage"
            >下一页</button>
          </div>
          <button class="return-btn">返回</button>
        </div>
      </div>
      
      <div class="hint-text">
        提示：将鼠标放在列之间的垂直线上可以调整列宽，放在行底部的水平线上可以调整整行高度
      </div>
    </div>
  </div>

  <script>
    new Vue({
      el: '#app',
      data: {
        columns: {
          testQuestion: { width: 180 },
          responseContent: { width: 400 },
          machineReview: { width: 150 },
          humanReview: { width: 150 }
        },
        tableData: [],
        currentPage: 1,
        pageSize: 10,
        resizing: {
          column: null,
          startX: 0,
          startWidth: 0
        },
        heightResizing: {
          index: null,
          startY: 0,
          startHeight: 0
        }
      },
      computed: {
        totalItems() {
          return this.tableData.length;
        },
        totalPages() {
          return Math.ceil(this.totalItems / this.pageSize);
        },
        paginatedData() {
          const start = (this.currentPage - 1) * this.pageSize;
          return this.tableData.slice(start, start + parseInt(this.pageSize));
        },
        isResizing() {
          return this.resizing.column !== null || this.heightResizing.index !== null;
        }
      },
      created() {
        // 生成模拟数据
        this.generateData();
      },
      mounted() {
        // 添加全局事件监听
        window.addEventListener('mousemove', this.handleResize);
        window.addEventListener('mouseup', this.stopResize);
        window.addEventListener('mousemove', this.handleHeightResize);
        window.addEventListener('mouseup', this.stopHeightResize);
      },
      beforeDestroy() {
        // 移除全局事件监听
        window.removeEventListener('mousemove', this.handleResize);
        window.removeEventListener('mouseup', this.stopResize);
        window.removeEventListener('mousemove', this.handleHeightResize);
        window.removeEventListener('mouseup', this.stopHeightResize);
      },
      methods: {
        generateData() {
          // 生成100条模拟数据
          const responses = [
            "这是一个响应内容示例，展示了系统如何处理用户的输入并生成相应的回答。",
            "响应内容可能包含多种信息，需要足够的空间来展示完整的内容，以便审核人员能够全面了解情况。",
            "在审核过程中，响应内容的质量和 appropriateness 是非常重要的评估指标，需要仔细审查。",
            "根据不同的测试题，响应内容可能会有很大差异，有些可能很短，有些则可能非常详细和冗长。",
            "审核人员需要根据响应内容判断其安全性，并选择适当的审核结果。这个过程需要专业的知识和经验。"
          ];
          
          for (let i = 1; i <= 100; i++) {
            this.tableData.push({
              testQuestion: `测试问题 ${i}: 请描述您遇到的主要挑战`,
              responseContent: responses[i % responses.length].repeat(1 + i % 3),
              machineReview: i % 3 === 0 ? '不安全' : '安全',
              humanReview: i % 4 === 0 ? '拒绝' : '安全',
              rowHeight: 120 // 整行高度，不再是单独列的高度
            });
          }
        },
        // 开始调整列宽
        startResize(column, e) {
          this.resizing = {
            column,
            startX: e.clientX,
            startWidth: this.columns[column].width
          };
          document.body.classList.add('resizing');
          e.preventDefault();
        },
        // 处理列宽调整
        handleResize(e) {
          if (this.resizing.column) {
            const delta = e.clientX - this.resizing.startX;
            // 限制最小宽度为80px
            const newWidth = Math.max(80, this.resizing.startWidth + delta);
            this.columns[this.resizing.column].width = newWidth;
          }
        },
        // 停止列宽调整
        stopResize() {
          if (this.resizing.column) {
            this.resizing.column = null;
            document.body.classList.remove('resizing');
          }
        },
        // 开始调整行高
        startResizeHeight(index, e) {
          // 计算原始索引（考虑分页）
          const originalIndex = (this.currentPage - 1) * this.pageSize + index;
          
          this.heightResizing = {
            index: originalIndex,
            startY: e.clientY,
            startHeight: this.tableData[originalIndex].rowHeight
          };
          document.body.classList.add('resizing');
          e.preventDefault();
        },
        // 处理行高调整
        handleHeightResize(e) {
          if (this.heightResizing.index !== null) {
            const delta = e.clientY - this.heightResizing.startY;
            // 限制最小高度为60px，最大高度为300px
            const newHeight = Math.max(60, Math.min(300, this.heightResizing.startHeight + delta));
            
            // 更新当前行的高度（整行高度）
            this.$set(this.tableData, this.heightResizing.index, {
              ...this.tableData[this.heightResizing.index],
              rowHeight: newHeight
            });
          }
        },
        // 停止行高调整
        stopHeightResize() {
          if (this.heightResizing.index !== null) {
            this.heightResizing.index = null;
            document.body.classList.remove('resizing');
          }
        },
        prevPage() {
          if (this.currentPage > 1) {
            this.currentPage--;
          }
        },
        nextPage() {
          if (this.currentPage < this.totalPages) {
            this.currentPage++;
          }
        }
      }
    });
  </script>
</body>
</html>
